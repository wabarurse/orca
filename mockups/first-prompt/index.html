<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>orca · final preview</title>
  <link rel="stylesheet" href="/mockup-pick/styles.css">
</head>
<body>
  <nav aria-label="Jump to a mockup">
    <a class="nav-brand" href="#top">orca / final preview</a>
    <div id="letters"></div>
    <button id="motion" type="button">pause motion</button>
  </nav>
  <main id="top">
    <header class="intro">
      <p class="eyebrow">new chat → first prompt</p>
      <h1>Static orca. Swimming fin.</h1>
      <p>Send the sample prompt to switch from the orca in the conversation to the animated fin in the top bar.</p>
      <div class="all-controls" aria-label="Preview every mockup">
        <span>preview:</span>
        <button id="all-new" type="button">new chat</button>
        <button id="all-sent" type="button">first prompt sent</button>
      </div>
    </header>
    <div id="gallery"></div>
  </main>
  <script type="module">
    import { variants } from '/mockup-pick/variants.js';
    import { mountGallery } from '/mockup-pick/shared.js';
    mountGallery([variants[0]]);
  </script>
</body>
</html>
