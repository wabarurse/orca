<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orca · choose your whale</title>
<style>
  :root { color-scheme:dark; --page:#111315; --surface:#17191c; --terminal:#0c0e10; --ink:#e5e7e8; --muted:#8a9297; --line:#32373c; --accent:#a0c4ce; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body.light { color-scheme:light; --page:#eeefed; --surface:#f7f7f5; --terminal:#fff; --ink:#1d2226; --muted:#697276; --line:#cdd2d3; --accent:#25596a; }
  button,a,select { -webkit-tap-highlight-color:transparent; }
  button,select { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:5px; padding:6px 12px; cursor:pointer; }
  button:hover,button:focus-visible,a:focus-visible { border-color:var(--accent); color:var(--accent); outline:2px solid transparent; }
  button[aria-pressed=true] { border-color:var(--accent); background:var(--accent); color:var(--terminal); }
  nav { position:sticky; top:0; z-index:5; border-bottom:1px solid var(--line); background:var(--page); padding:15px max(24px,calc((100% - 1080px)/2)); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .wordmark { font:600 19px ui-monospace,SFMono-Regular,Menlo,monospace; margin-right:20px; letter-spacing:-.05em; }
  nav a { border:1px solid var(--line); border-radius:30px; color:var(--muted); padding:2px 11px; text-decoration:none; font:12px/1.8 ui-monospace,monospace; }
  nav a:hover { color:var(--ink); border-color:var(--ink); }
  .controls { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .controls button,.controls select { font-size:12px; }
  main { max-width:1080px; margin:auto; padding:52px 24px 90px; }
  .eyebrow { font:11px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.15em; color:var(--accent); }
  h1 { font-weight:500; font-size:clamp(28px,4vw,44px); line-height:1.2; letter-spacing:-.04em; margin:14px 0; }
  .intro { color:var(--muted); max-width:660px; font-size:15px; margin:0 0 32px; }
  .legend { display:flex; gap:22px; color:var(--muted); font:12px ui-monospace,monospace; border-top:1px solid var(--line); padding-top:15px; flex-wrap:wrap; }
  section { margin-top:64px; scroll-margin-top:100px; }
  .section-meta { display:flex; justify-content:space-between; align-items:start; gap:18px; margin-bottom:18px; }
  .title { display:flex; align-items:center; gap:12px; }
  .letter { font:12px ui-monospace,monospace; border:1px solid var(--line); border-radius:50%; width:28px; height:28px; display:grid; place-items:center; }
  h2 { font-size:20px; letter-spacing:-.025em; font-weight:500; margin:0; }
  .description { color:var(--muted); margin:7px 0 0 40px; max-width:650px; }
  .choose { flex:none; font-size:12px; }
  .terminal-wrap { width:100%; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--terminal); }
  .terminal { width:1000px; padding:18px 22px; font:12px/16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .terminal.narrow { width:690px; margin:auto; }
  .terminal-top { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:10px; margin-bottom:18px; }
  .dots { display:flex; gap:5px; margin-right:8px; } .dots i { width:6px; height:6px; background:var(--line); border-radius:50%; }
  .terminal-top .right { margin-left:auto; }
  .brand { font-weight:600; color:var(--ink); }
  .art { font:inherit; margin:0; white-space:pre; color:var(--ink); overflow:hidden; line-height:14px; letter-spacing:0; user-select:text; }
  .header-layout { position:relative; min-height:70px; }
  .compact .header-layout { display:grid; grid-template-columns:230px 1fr; gap:8px; align-items:center; }
  .compact .art { width:230px; }
  .waterline .brand, .pod .brand, .lane .brand { position:absolute; top:2px; left:0; }
  .breach .header-layout { display:grid; grid-template-columns:280px 1fr; align-items:center; }
  .split .header-layout { display:flex; justify-content:space-between; align-items:center; }
  .split .art { width:290px; order:2; }
  .split .brand { margin-bottom:9px; }
  .meta-lines { white-space:nowrap; color:var(--muted); overflow:hidden; }
  .meta-lines b { font-weight:500; color:var(--ink); }
  .status-dot { color:var(--accent); }
  .tabs { white-space:nowrap; overflow:hidden; color:var(--muted); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px 0; margin-top:8px; }
  .tabs strong { font-weight:500; color:var(--ink); }
  .row-details { color:var(--muted); padding:7px 0; overflow:hidden; white-space:nowrap; }
  .conversation { padding:19px 0 22px; color:var(--muted); min-height:140px; }
  .prompt { background:var(--surface); color:var(--ink); padding:7px 10px; margin-bottom:14px; }
  .reply { color:var(--ink); padding:0 10px; }
  .tool { margin:12px 0 0 10px; }
  .composer { border:1px solid var(--line); background:var(--surface); padding:8px 10px; color:var(--muted); }
  .footer { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; padding-top:6px; }
  .note { color:var(--muted); font:11px/1.6 ui-monospace,monospace; margin-top:10px; }
  .selection { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--terminal); padding:13px 22px; border-radius:7px; box-shadow:0 4px 35px #0004; max-width:calc(100vw - 30px); z-index:6; display:none; text-align:center; }
  @media(max-width:720px) { nav { padding:12px 16px; } .controls { margin:5px 0 0; width:100%; } main{padding:30px 16px 80px;} .section-meta{gap:10px;} .description{margin-left:0;} .terminal{padding:16px;} .wordmark{margin-right:10px;} }
</style>
</head>
<body>
<nav aria-label="header options">
  <span class="wordmark">orca</span><div id="letters" style="display:flex;gap:5px"></div>
  <div class="controls">
    <button id="pause" type="button">pause motion</button>
    <select id="activity" aria-label="agent activity"><option value="working">working</option><option value="idle">idle</option></select>
    <select id="width" aria-label="terminal width"><option value="wide">wide terminal</option><option value="narrow">narrow terminal</option></select>
    <button id="theme" type="button">light background</button>
  </div>
</nav>
<main>
  <div class="eyebrow">header studies / 01</div>
  <h1>A little life above the work.</h1>
  <p class="intro">Six moving killer whales, drawn entirely with ASCII characters. Same conversation, same project details. Choose the motion and the amount of space that feel right.</p>
  <div class="legend"><span>monochrome ASCII</span><span>lowercase orca</span><span>motion pauses when idle</span></div>
  <div id="gallery"></div>
</main>
<div id="selection" class="selection" role="status"></div>
<script type="module">
import { variants, frame } from '/animation.js';
const sample = { project:'phoebe', model:'gpt-6-astra', context:'24k / 272k', directory:'~/documents/phoebe/phoebe' };
const metadata = () => `<div class="meta-lines"><div><b>orca</b> &nbsp; <span class="status-dot">*</span> <span class="activity-label">working</span></div><div>${sample.model} &middot; medium &middot; ${sample.context}</div><div>${sample.directory}</div></div>`;
document.querySelector('#letters').innerHTML = variants.map(v=>`<a href="#${v.id}" aria-label="option ${v.id.toUpperCase()}: ${v.name}">${v.id.toUpperCase()}</a>`).join('');
document.querySelector('#gallery').innerHTML = variants.map(v=>{
  const integrated = ['compact','breach','split'].includes(v.layout);
  return `<section id="${v.id}" aria-labelledby="title-${v.id}">
    <div class="section-meta"><div><div class="title"><span class="letter">${v.id.toUpperCase()}</span><h2 id="title-${v.id}">${v.name}</h2></div><p class="description">${v.blurb}</p></div><button class="choose" data-pick="${v.id}" aria-pressed="false">choose ${v.id.toUpperCase()}</button></div>
    <div class="terminal-wrap"><div class="terminal ${v.layout}">
      <div class="terminal-top"><span class="dots"><i></i><i></i><i></i></span>orca &mdash; ${sample.project}<span class="right">preview</span></div>
      <div class="header-layout">${integrated?'':'<span class="brand">orca</span>'}<pre class="art" data-art="${v.id}" aria-label="animated ASCII killer whale"></pre>${integrated?metadata():''}</div>
      <div class="tabs"><strong>&gt;[${sample.project}]</strong> &nbsp; [harness] &nbsp; [notes] &nbsp; ------------------------------------</div>
      ${integrated?'':`<div class="row-details">${sample.model} &middot; medium &middot; ${sample.context} &middot; <span class="activity-label">working</span></div>`}
      <div class="conversation"><div class="prompt">&gt; fix the database query timeout</div><div class="reply">I'll check the connection and add a bounded timeout.</div><div class="tool">&gt; bash &nbsp; inspecting the query wrapper<br>&nbsp; &nbsp; running...</div></div>
      <div class="composer">&gt; ask orca anything<span style="float:right">|</span></div><div class="footer"><span>1 agent &middot; 0 queued</span><span>/help &nbsp; /models</span></div>
    </div></div><div class="note">${v.size} of whale motion &middot; same character grid in every frame</div>
  </section>`;
}).join('');
let paused = matchMedia('(prefers-reduced-motion: reduce)').matches, active = true, elapsed = 0, previous = performance.now();
const pause = document.querySelector('#pause');
const arts = [...document.querySelectorAll('[data-art]')];
function fitPreviews() {
  const width = document.querySelector('#width').value==='narrow'?690:1000;
  document.querySelectorAll('.terminal').forEach(el=>{
    el.style.zoom=String(Math.min(1,el.parentElement.clientWidth/width));
  });
}
const previewObserver = new ResizeObserver(fitPreviews);
document.querySelectorAll('.terminal-wrap').forEach(el=>previewObserver.observe(el));
function repaint() {
  for (const element of arts) {
    const id = element.dataset.art;
    const cols = ['a','c','d'].includes(id) ? (id==='a'?31:38) : (document.querySelector('#width').value==='narrow'?75:126);
    element.textContent = frame(id,cols,elapsed,active);
  }
}
pause.textContent = paused?'play motion':'pause motion';
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'play motion':'pause motion';};
document.querySelector('#activity').onchange=e=>{active=e.target.value==='working';document.querySelectorAll('.activity-label').forEach(el=>el.textContent=active?'working':'idle');repaint();};
document.querySelector('#width').onchange=e=>{document.querySelectorAll('.terminal').forEach(el=>el.classList.toggle('narrow',e.target.value==='narrow'));fitPreviews();repaint();};
document.querySelector('#theme').onclick=e=>{const light=document.body.classList.toggle('light');e.target.textContent=light?'dark background':'light background';};
document.querySelectorAll('[data-pick]').forEach(button=>button.onclick=()=>{
  const id=button.dataset.pick, v=variants.find(v=>v.id===id);
  document.querySelectorAll('[data-pick]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
  const selection=document.querySelector('#selection');selection.style.display='block';selection.textContent=`${id.toUpperCase()} · ${v.name} selected. Tell Codex “${id.toUpperCase()}” to use this whale, or describe a remix.`;
});
repaint();
setInterval(()=>{const now=performance.now();if(!paused&&active&&document.visibilityState==='visible')elapsed+=(now-previous)/1000;previous=now;repaint();},160);
</script>
</body></html>
